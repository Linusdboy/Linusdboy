<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0A0A0C',
                        cardBg: '#1E1E24',
                        cardBorder: '#2D2D38',
                        cardInner: '#141418',
                        accent: '#8B5CF6',
                        accentHover: '#7C3AED',
                        mutedText: '#94A3B8',
                        lightText: '#E2E8F0',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkBg text-lightText min-h-screen flex flex-col items-center justify-between p-4 font-sans select-none">

    <!-- Header Bar -->
    <header class="w-full max-w-md flex justify-between items-center my-4 px-2">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">
            LEXICON
        </h1>
        <div class="flex items-center space-x-1.5 bg-cardBg border border-cardBorder px-3 py-1.5 rounded-full text-xs font-semibold text-purple-400 shadow-sm">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        </div>
    </header>

    <!-- Main Word Card -->
    <main class="w-full max-w-md bg-cardBg border border-cardBorder rounded-3xl p-6 shadow-2xl shadow-purple-950/20 backdrop-blur-md relative overflow-hidden my-auto">
        
        <!-- Glow Accent Background -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Loading / Content State -->
        <div id="card-content" class="transition-opacity duration-300">
            <!-- Word Title & Pronunciation Action Buttons -->
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span id="word-pos" class="text-xs uppercase tracking-widest text-purple-400 font-semibold">
                        loading...
                    </span>
                    <h2 id="word-title" class="text-4xl font-extrabold text-white mt-1 tracking-tight">
                        Discovering
                    </h2>
                    <p id="word-phonetic" class="text-sm text-mutedText mt-1 font-mono">
                        / ... /
                    </p>
                </div>

                <div class="flex space-x-2">
                    <button 
                        onclick="playAudio()"
                        class="p-3 bg-[#2A2A35] hover:bg-[#353544] text-purple-400 rounded-full transition-colors cursor-pointer"
                        title="Pronounce word"
                    >
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                    </button>
                    <button 
                        id="bookmark-btn"
                        onclick="toggleBookmark()"
                        class="p-3 rounded-full transition-colors bg-[#2A2A35] text-mutedText hover:bg-[#353544] cursor-pointer"
                        title="Bookmark word"
                    >
                        <i data-lucide="bookmark" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Definition Section -->
            <div class="my-6">
                <h3 class="text-xs font-semibold text-mutedText uppercase tracking-wider mb-2">
                    Definition
                </h3>
                <p id="word-definition" class="text-lg text-slate-200 leading-relaxed font-light">
                    "Fetching a fresh, brilliant word from the infinite lexicon..."
                </p>
            </div>

            <!-- Real-World Context / Example -->
            <div class="bg-cardInner border border-[#2B2B36] rounded-2xl p-4 mb-6">
                <h3 class="text-xs font-semibold text-purple-400 uppercase tracking-wider mb-1">
                    Example
                </h3>
                <p id="word-example" class="text-sm text-slate-300 italic">
                    "..."
                </p>
            </div>

            <!-- Etymology Origin -->
            <div class="text-xs text-mutedText border-t border-cardBorder pt-4">
                <span class="font-semibold text-slate-400">Origin: </span> 
                <span id="word-origin">Generated dynamically.</span>
            </div>
        </div>
    </main>

    <!-- Bottom Action Control -->
    <footer class="w-full max-w-md my-4">
        <button 
            id="next-btn"
            onclick="fetchRandomWord()"
            class="w-full bg-accent hover:bg-accentHover text-white font-semibold py-4 rounded-2xl flex items-center justify-center space-x-2 shadow-lg shadow-purple-900/30 transition-all hover:scale-[1.01] active:scale-[0.99] cursor-pointer"
        >
            <span id="btn-text">Next Unseen Word</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
    </footer>

    <!-- App Logic Script -->
    <main-script>
    <script>
        // A curated seed list of advanced, sophisticated, and aesthetic words to query from the API
        const expansionSeedWords = [
            "serendipity", "halcyon", "mellifluous", "petrichor", "ephemeral", 
            "Luminous", "sempiternal", "sonder", "ineffable", "susurrus", 
            "resplendent", "taciturn", "panacea", "solitude", "nebula",
            "zenith", "quixotic", "alacrity", "cynosure", "effervescent",
            "evanescent", "halcyon", "labyrinthine", "mellifluous", "nadir",
            "panache", "quintessence", "reverie", "sanguine", "tintinnabulation"
        ];

        let seenWords = JSON.parse(localStorage.getItem('lexicon_seen_words') || '[]');
        let isSaved = false;

        async function fetchRandomWord() {
            const btn = document.getElementById('next-btn');
            const btnText = document.getElementById('btn-text');
            btn.disabled = true;
            btnText.innerText = "Finding word...";

            try {
                // Pick a random word from our seed generator pool
                let randomWord = expansionSeedWords[Math.floor(Math.random() * expansionSeedWords.length)];
                
                // Fetch definition from Free Dictionary API
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${randomWord}`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch definition');
                }

                const data = await response.json();
                const entry = data[0];
                const meaning = entry.meanings[0];
                const definitionObj = meaning.definitions[0];

                const wordData = {
                    word: entry.word.charAt(0).toUpperCase() + entry.word.slice(1),
                    phonetic: entry.phonetic || (entry.phonetics.find(p => p.text) ? entry.phonetics.find(p => p.text).text : '/ — /'),
                    partOfSpeech: meaning.partOfSpeech || 'noun',
                    definition: definitionObj.definition || 'No definition available.',
                    example: definitionObj.example || `The concept of ${entry.word} is deeply fascinating.`,
                    origin: entry.origin || 'Derived from historical roots and linguistic evolution.'
                };

                // Render to UI
                document.getElementById('word-pos').innerText = wordData.partOfSpeech;
                document.getElementById('word-title').innerText = wordData.word;
                document.getElementById('word-phonetic').innerText = wordData.phonetic;
                document.getElementById('word-definition').innerText = `"${wordData.definition}"`;
                document.getElementById('word-example').innerText = `"${wordData.example}"`;
                document.getElementById('word-origin').innerText = wordData.origin;

                isSaved = false;
                updateBookmarkUI();

            } catch (error) {
                console.error(error);
                document.getElementById('word-title').innerText = "Resilience";
                document.getElementById('word-definition').innerText = `"The capacity to recover quickly from difficulties; toughness."`;
                document.getElementById('word-example').innerText = `"She showed great resilience in pursuit of her goals."`;
            } finally {
                btn.disabled = false;
                btnText.innerText = "Next Unseen Word";
            }
        }

        function playAudio() {
            const wordText = document.getElementById('word-title').innerText;
            const utterance = new SpeechSynthesisUtterance(wordText);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function toggleBookmark() {
            isSaved = !isSaved;
            updateBookmarkUI();
        }

        function updateBookmarkUI() {
            const btn = document.getElementById('bookmark-btn');
            if (isSaved) {
                btn.className = "p-3 rounded-full transition-colors bg-accent text-white cursor-pointer shadow-md shadow-purple-900/50";
            } else {
                btn.className = "p-3 rounded-full transition-colors bg-[#2A2A35] text-mutedText hover:bg-[#353544] cursor-pointer";
            }
        }

        // Initialize icons and load first auto-generated word
        lucide.createIcons();
        fetchRandomWord();
    </script>
    </main-script>
</body>
</html>
